global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'platform-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:80']
        labels:
          service: 'capital-market-api'

  - job_name: 'mysql'
    static_configs:
      - targets: ['db:3306']
        labels:
          service: 'mysql'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
